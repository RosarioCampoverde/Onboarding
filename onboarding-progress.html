<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Onboarding Progress · Luna</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      background: #f3f4f6;
      color: #1f2328;
      min-height: 100vh;
    }

    /* ── NAV ── */
    nav {
      background: #7c3aed;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 0 28px;
      height: 56px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-logo {
      width: 36px; height: 36px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }
    .nav-logo img { width: 36px; height: 36px; object-fit: cover; }
    .nav-title { color: #fff; font-weight: 600; font-size: 15px; }
    .nav-back {
      color: rgba(255,255,255,0.85);
      text-decoration: none;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: color .15s;
      position: absolute;
      right: 28px;
    }
    .nav-back:hover { color: #fff; }
    .nav-back svg { width: 15px; height: 15px; }

    /* ── LAYOUT ── */
    .page {
      max-width: 820px;
      margin: 0 auto;
      padding: 32px 20px 60px;
    }

    /* ── HEADER SUMMARY ── */
    .summary-card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 28px 28px 24px;
      margin-bottom: 28px;
    }
    .summary-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }
    .summary-title {
      font-size: 20px;
      font-weight: 700;
      color: #1f2328;
      margin-bottom: 2px;
    }
    .summary-sub {
      font-size: 13px;
      color: #57606a;
    }
    .summary-pct {
      font-size: 36px;
      font-weight: 800;
      color: #7c3aed;
      letter-spacing: -1px;
      line-height: 1;
    }
    .summary-pct-label {
      font-size: 12px;
      color: #9ca3af;
      text-align: right;
    }
    .summary-bar-wrap {
      background: #e5e7eb;
      border-radius: 999px;
      height: 10px;
      overflow: hidden;
      margin-top: 20px;
    }
    .summary-bar-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #7c3aed, #a78bfa);
      width: 35%;
      transition: width 0.6s ease;
    }
    .summary-counts {
      display: flex;
      gap: 20px;
      margin-top: 14px;
      flex-wrap: wrap;
    }
    .count-pill {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      color: #374151;
    }
    .count-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot-done    { background: #10b981; }
    .dot-active  { background: #7c3aed; }
    .dot-pending { background: #d1d5db; }

    /* ── SECTION GROUP ── */
    .section-group {
      margin-bottom: 24px;
    }
    .section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .section-icon {
      width: 34px; height: 34px;
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .section-icon svg { width: 16px; height: 16px; }
    .si-blue   { background: #dbeafe; } .si-blue   svg { stroke: #2563eb; }
    .si-purple { background: #ede9fe; } .si-purple svg { stroke: #7c3aed; }
    .si-green  { background: #d1fae5; } .si-green  svg { stroke: #059669; }
    .si-amber  { background: #fef3c7; } .si-amber  svg { stroke: #d97706; }
    .si-red    { background: #fee2e2; } .si-red    svg { stroke: #dc2626; }
    .si-teal   { background: #ccfbf1; } .si-teal   svg { stroke: #0f766e; }
    .si-indigo { background: #e0e7ff; } .si-indigo svg { stroke: #4338ca; }
    .si-pink   { background: #fce7f3; } .si-pink   svg { stroke: #9d174d; }

    .section-label {
      font-size: 15px;
      font-weight: 700;
      color: #1f2328;
    }
    .section-progress-text {
      font-size: 12px;
      color: #9ca3af;
      margin-left: auto;
    }

    /* ── STEP CARD ── */
    .step-card {
      background: #fff;
      border: 1.5px solid #e5e7eb;
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      align-items: flex-start;
      gap: 13px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: border-color .15s, background .15s;
      position: relative;
    }
    .step-card:hover {
      border-color: #c4b5fd;
      background: #fdfcff;
    }
    .step-card.done {
      background: #f0fdf4;
      border-color: #bbf7d0;
    }
    .step-card.active {
      border-color: #a78bfa;
      background: #faf5ff;
    }
    .step-card.locked {
      opacity: 0.55;
      cursor: default;
    }
    .step-card.locked:hover {
      border-color: #e5e7eb;
      background: #fff;
    }

    /* ── CHECKBOX ── */
    .step-check {
      width: 22px; height: 22px;
      border-radius: 6px;
      border: 2px solid #d1d5db;
      flex-shrink: 0;
      margin-top: 1px;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s, border-color .15s;
    }
    .step-check svg { width: 12px; height: 12px; stroke: #fff; fill: none; stroke-width: 2.5; }
    .step-card.done .step-check   { background: #10b981; border-color: #10b981; }
    .step-card.active .step-check { border-color: #7c3aed; }

    /* ── STEP TEXT ── */
    .step-body { flex: 1; min-width: 0; }
    .step-title {
      font-size: 14px;
      font-weight: 600;
      color: #0f172a;
      line-height: 1.35;
    }
    .step-card.done .step-title {
      color: #9ca3af;
      text-decoration: line-through;
    }
    .step-desc {
      font-size: 12px;
      color: #6b7280;
      margin-top: 3px;
      line-height: 1.5;
    }
    .step-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 7px;
    }
    .step-tag {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 20px;
    }
    .tag-required  { background: #fee2e2; color: #991b1b; }
    .tag-deadline  { background: #fef3c7; color: #92400e; }
    .tag-optional  { background: #f3f4f6; color: #6b7280; }
    .tag-online    { background: #dbeafe; color: #1d4ed8; }
    .tag-inperson  { background: #d1fae5; color: #065f46; }

    /* ── STEP BADGE (status indicator) ── */
    .step-status {
      flex-shrink: 0;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 9px;
      border-radius: 20px;
      align-self: flex-start;
      margin-top: 2px;
    }
    .status-done    { background: #d1fae5; color: #065f46; }
    .status-active  { background: #ede9fe; color: #5b21b6; }
    .status-pending { background: #f3f4f6; color: #6b7280; }
    .status-locked  { background: #f3f4f6; color: #9ca3af; }

    /* ── EXPAND DETAIL ── */
    .step-detail {
      display: none;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #e5e7eb;
    }
    .step-detail.open { display: block; }
    .step-detail p {
      font-size: 13px;
      color: #374151;
      margin-bottom: 8px;
      line-height: 1.6;
    }
    .detail-action {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 14px;
      border-radius: 7px;
      border: 1px solid #e5e7eb;
      background: #fff;
      font-size: 12px;
      font-weight: 500;
      color: #374151;
      text-decoration: none;
      cursor: pointer;
      transition: border-color .15s, color .15s, background .15s;
      margin-right: 6px;
      margin-top: 4px;
    }
    .detail-action svg { width: 12px; height: 12px; }
    .detail-action:hover { border-color: #7c3aed; color: #7c3aed; background: #f5f3ff; }
    .detail-action.primary { background: #7c3aed; color: #fff; border-color: #7c3aed; }
    .detail-action.primary:hover { background: #6d28d9; border-color: #6d28d9; }

    .step-toggle-icon {
      width: 18px; height: 18px;
      flex-shrink: 0;
      stroke: #9ca3af;
      transition: transform .2s;
      align-self: center;
    }
    .step-card.expanded .step-toggle-icon { transform: rotate(90deg); }

    /* mini section progress bar */
    .section-mini-bar {
      height: 4px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .section-mini-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #7c3aed, #a78bfa);
      transition: width .4s;
    }
  </style>
</head>

/* ═══════════════════════════════════════════
   STATE
═══════════════════════════════════════════ */
// Load saved state from sessionStorage
function loadState() {
  try {
    return JSON.parse(sessionStorage.getItem('ob_state') || '{}');
  } catch { return {}; }
}
function saveState(state) {
  sessionStorage.setItem('ob_state', JSON.stringify(state));
}

let stepState = loadState(); // { stepId: 'done' | 'active' | 'pending' }
let expandedId = null;

// Merge data statuses with any user overrides
function getStatus(step) {
  return stepState[step.id] !== undefined ? stepState[step.id] : step.status;
}

/* ═══════════════════════════════════════════
   COUNTS
═══════════════════════════════════════════ */
function recomputeCounts() {
  let done = 0, active = 0, pending = 0, total = 0;
  CATEGORIES.forEach(cat => {
    cat.steps.forEach(s => {
      total++;
      const st = getStatus(s);
      if (st === 'done') done++;
      else if (st === 'active') active++;
      else pending++;
    });
  });
  const pct = Math.round((done / total) * 100);
  document.getElementById('pct-display').textContent = pct + '%';
  document.getElementById('summary-bar').style.width = pct + '%';
  document.getElementById('count-done').textContent = done;
  document.getElementById('count-active').textContent = active;
  document.getElementById('count-pending').textContent = pending;
  return { done, active, pending, total };
}

/* ═══════════════════════════════════════════
   RENDER
═══════════════════════════════════════════ */
function statusLabel(s) {
  if (s === 'done')   return '<span class="step-status status-done">Done</span>';
  if (s === 'active') return '<span class="step-status status-active">In Progress</span>';
  return '<span class="step-status status-pending">To Do</span>';
}

function tagHTML(tags) {
  return tags.map(t => {
    const cls = {
      required: 'tag-required',
      deadline: 'tag-deadline',
      optional: 'tag-optional',
      online:   'tag-online',
      inperson: 'tag-inperson'
    }[t] || 'tag-optional';
    const label = {
      required: 'Required',
      deadline: 'Has Deadline',
      optional: 'Optional',
      online:   'Online',
      inperson: 'In Person'
    }[t] || t;
    return `<span class="step-tag ${cls}">${label}</span>`;
  }).join('');
}

function checkSVG() {
  return `<svg viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3"/></svg>`;
}

function chevronSVG() {
  return `<svg class="step-toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>`;
}

function renderStep(step) {
  const st = getStatus(step);
  const isExpanded = expandedId === step.id;
  const cardClasses = ['step-card', st, isExpanded ? 'expanded' : ''].filter(Boolean).join(' ');
  const checkClasses = ['step-check', st === 'done' ? 'done' : ''].filter(Boolean).join(' ');
  const actionHTML = step.action
    ? `<a class="detail-action primary" href="${step.action.url}" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        ${step.action.label}
       </a>` : '';

  const nextStatus = st === 'done' ? 'active' : st === 'active' ? 'done' : 'done';
  const toggleLabel = st === 'done' ? 'Mark as To Do' : 'Mark as Done';

  return `
    <div class="${cardClasses}" data-id="${step.id}">
      <div class="${checkClasses}">${st === 'done' ? checkSVG() : ''}</div>
      <div class="step-body">
        <div class="step-title">${step.title}</div>
        <div class="step-desc">${step.desc}</div>
        <div class="step-tags">${tagHTML(step.tags)}</div>
        <div class="step-detail ${isExpanded ? 'open' : ''}">
          <p>${step.detail}</p>
          <div>
            ${actionHTML}
            <button class="detail-action" data-toggle-status="${step.id}" data-next="${st === 'done' ? 'pending' : 'done'}">
              ${st === 'done' ? 'Mark as To Do' : 'Mark as Done'}
            </button>
          </div>
        </div>
      </div>
      ${statusLabel(st)}
      ${chevronSVG()}
    </div>`;
}

function renderCategory(cat) {
  const steps = cat.steps;
  const doneCount = steps.filter(s => getStatus(s) === 'done').length;
  const pct = Math.round((doneCount / steps.length) * 100);
  return `
    <div class="section-group" data-cat="${cat.id}">
      <div class="section-header">
        <div class="section-icon ${cat.iconColor}">${cat.icon}</div>
        <span class="section-label">${cat.label}</span>
        <span class="section-progress-text">${doneCount}/${steps.length}</span>
      </div>
      <div class="section-mini-bar">
        <div class="section-mini-fill" style="width:${pct}%"></div>
      </div>
      <div class="section-steps">
        ${steps.map(renderStep).join('')}
      </div>
    </div>`;
}

function renderAll() {
  document.getElementById('checklist-root').innerHTML = CATEGORIES.map(renderCategory).join('');
  recomputeCounts();
  attachListeners();
}

/* ═══════════════════════════════════════════
   LISTENERS
═══════════════════════════════════════════ */
function attachListeners() {
  // Card click → expand/collapse
  document.querySelectorAll('.step-card').forEach(card => {
    card.addEventListener('click', function(e) {
      // Don't expand if clicking action buttons inside detail
      if (e.target.closest('.detail-action')) return;
      const id = this.dataset.id;
      expandedId = expandedId === id ? null : id;
      renderAll();
    });
  });

  // Status toggle button
  document.querySelectorAll('[data-toggle-status]').forEach(btn => {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      const id = this.dataset.toggleStatus;
      const next = this.dataset.next;
      stepState[id] = next;
      saveState(stepState);
      renderAll();
    });
  });
}

/* ═══════════════════════════════════════════
   INIT
═══════════════════════════════════════════ */
renderAll();
</script>
